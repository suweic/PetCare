# 开发环境配置

# 开发模式：允许在日志中输出验证码等调试信息
app:
  dev-mode: true

# JWT 配置
# ⚠️ jwt.secret 必须通过 JWT_SECRET 环境变量配置，至少 32 字符
# 生成方式: openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400

spring:
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    url: jdbc:mysql://localhost:3307/petcare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:petcare}
    # ⚠️ DB_PASSWORD 必须通过环境变量配置，不再提供默认值
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ⚠️ REDIS_PASSWORD 必须通过环境变量配置，不再提供默认值
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j / Swagger — 仅在开发环境开启
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true

logging:
  level:
    com.petcare: DEBUG
