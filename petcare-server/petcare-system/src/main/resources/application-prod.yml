# 生产环境配置
spring:
  # 生产环境必须禁用 Flyway 自动迁移
  # 数据库变更应通过人工审核的 SQL 脚本执行，避免种子数据泄漏或意外 schema 变更
  flyway:
    enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Knife4j / Swagger — 生产环境必须关闭
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false

# CORS — 生产环境必须配置为实际域名
# 多个域名用英文逗号分隔，示例：https://web.petcare.com,https://admin.petcare.com
cors:
  allowed-origins:
  allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:}

logging:
  level:
    com.petcare: INFO
    root: WARN
