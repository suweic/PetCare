server:
  port: 8080

spring:
  application:
    name: petcare-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 应用自定义配置
app:
  dev-mode: false  # 开发模式（开发环境通过 application-dev.yml 覆盖为 true）

# AI预问诊 LLM 配置
llm:
  api:
    url: ${LLM_API_URL:}        # LLM API地址（OpenAI兼容接口）
    key: ${LLM_API_KEY:}        # LLM API密钥
    model: ${LLM_MODEL:gpt-4o-mini}  # 使用的模型

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:5173
  allowed-origin-patterns: http://localhost:*

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400

# SpringDoc / Knife4j API 文档配置
# 文档页面: http://localhost:8080/doc.html
# JSON 接口: http://localhost:8080/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户端'
      paths-to-match: /api/**
      packages-to-scan: com.petcare.system.controller
    - group: '管理端'
      paths-to-match: /api/admin/**
      packages-to-scan: com.petcare.system.controller
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-footer: false

# Actuator 监控（仅暴露 health，供 Docker / K8s 健康检查使用）
management:
  endpoints:
    web:
      exposure:
        include: health
