server:
  port: 8080
  # 信任反向代理（Nginx/Docker），从 X-Forwarded-For / X-Real-IP 解析真实客户端 IP
  # 用于限流、审计日志等场景，避免所有请求被识别为 nginx 容器 IP
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: petcare-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Flyway 数据库迁移
  # 初次启动时自动执行 db/migration/ 下的 SQL 脚本
  # 注意：Flyway 负责 DDL 版本管理，Docker init.sql 负责首次建库（二选一即可）
  # 生产环境建议关闭 Flyway 自动迁移，改用人工审核后手动执行
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8

# 应用自定义配置
app:
  dev-mode: false  # 开发模式（开发环境通过 application-dev.yml 覆盖为 true）

# AES-256-GCM 加密密钥（敏感个人信息加密存储）
# 32 字节 Base64，生成: openssl rand -base64 32
aes:
  key: ${AES_KEY:}

# AI预问诊 LLM 配置
llm:
  api:
    url: ${LLM_API_URL:}        # LLM API地址（OpenAI兼容接口）
    key: ${LLM_API_KEY:}        # LLM API密钥
    model: ${LLM_MODEL:gpt-4o-mini}  # 使用的模型

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:5173
  allowed-origin-patterns: http://localhost:*

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400

# SpringDoc / Knife4j API 文档配置
# 文档页面: http://localhost:8080/doc.html
# JSON 接口: http://localhost:8080/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户端'
      paths-to-match: /api/**
      packages-to-scan: com.petcare.system.controller
    - group: '管理端'
      paths-to-match: /api/admin/**
      packages-to-scan: com.petcare.system.controller
  default-flat-param-object: true

knife4j:
  enable: false  # 默认关闭，仅 dev 环境显式开启
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-footer: false

# Actuator 监控（仅暴露 health，供 Docker / K8s 健康检查使用）
management:
  endpoints:
    web:
      exposure:
        include: health
