server {
    listen       8080;  # 非 root 端口（安全加固）
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # ===== 安全响应头 =====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 生产环境启用 HTTPS 后请取消下面这行的注释：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 允许本站资源、内联样式/脚本（Vue SPA + Element Plus 需要）
    # ⚠️ 已知限制: style-src 'unsafe-inline' 削弱了 CSP 防护能力。
    # 迁移计划: Element Plus CSS 变量模式 + nonce 机制 — 跟踪: GitHub Issue #待创建
    # 安全评估: script-src 'self' 已阻止外部脚本注入，X-Frame-Options + X-Content-Type-Options 加固
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ws: wss:;" always;

    # 静态资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://petcare-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://petcare-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # 上传文件代理（医生证书、头像、问诊图片等）
    location /uploads/ {
        proxy_pass http://petcare-server:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
